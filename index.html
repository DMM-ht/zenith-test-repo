<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Live Portal</title>
</head>
<body style="background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 40px 10px;">

    <div style="text-align: center; margin-bottom: 40px;">
        <h1 style="color: #3fb950; margin-bottom: 5px;">📡 ZENITH LIVE HOME PORTAL</h1>
        <p style="color: #8b949e; margin-top: 0;">Multi-Media Cloud Network Active (Text • Photo • Video)</p>
    </div>

    <div style="max-width: 600px; margin: 0 auto;">
        <h3 style="border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #58a6ff;">📌 RECENT BROADCASTS</h3>
        <div id="news-container">
            <div style="color: #e3b341; padding: 20px; text-align: center;">Fetching secure cloud feed...</div>
        </div>
    </div>

    <script>
        async function fetchLiveFeeds() {
            const container = document.getElementById('news-container');
            try {
                const response = await fetch('database.json?nocache=' + new Date().getTime());
                if(!response.ok) throw new Error();
                
                const data = await response.json();
                container.innerHTML = ""; 
                
                if (data.news && data.news.length > 0) {
                    data.news.forEach(item => {
                        const block = document.createElement('div');
                        block.style.background = "#161b22";
                        block.style.border = "1px solid #30363d";
                        block.style.padding = "20px";
                        block.style.marginBottom = "15px";
                        block.style.borderRadius = "8px";
                        block.style.textAlign = "left";

                        let rawData = item.title;
                        
                        // Check karein kya Video ya Photo ka naya structure hai
                        if(rawData.includes("|||VIDEO|||")) {
                            let parts = rawData.split("|||VIDEO|||");
                            let textCaption = parts[0];
                            let videoSrc = parts[1];
                            
                            block.innerHTML = `
                                <p style="color:#f0f6fc; font-size:16px; margin-top:0;"><span style="color:#3fb950;">⚡</span> ${textCaption}</p>
                                <video controls style="width:100%; max-height:400px; border-radius:6px; border:1px solid #ff5555; background:#0d1117; margin-top:10px;">
                                    <source src="${videoSrc}" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                            `;
                        } else if(rawData.includes("|||IMAGE|||") || rawData.includes("|||")) {
                            // Purana format ya naya image format dono handle karega
                            let separator = rawData.includes("|||IMAGE|||") ? "|||IMAGE|||" : "|||";
                            let parts = rawData.split(separator);
                            let textCaption = parts[0];
                            let imageSrc = parts[1];
                            
                            block.innerHTML = `
                                <p style="color:#f0f6fc; font-size:16px; margin-top:0;"><span style="color:#3fb950;">⚡</span> ${textCaption}</p>
                                <img src="${imageSrc}" style="width:100%; max-height:400px; object-fit:contain; border-radius:6px; border:1px solid #30363d; background:#0d1117; margin-top:10px;">
                            `;
                        } else {
                            // Agar sirf text hai
                            block.innerHTML = `<span style="color:#3fb950; font-weight:bold; margin-right:8px;">⚡</span> ${rawData}`;
                        }
                        
                        container.appendChild(block);
                    });
                } else {
                    container.innerHTML = `<div style="text-align:center; color:#8b949e; padding:20px;">No feeds active.</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div style="text-align:center; color:#f85149; padding:20px;">❌ Sync pending...</div>`;
            }
        }

        fetchLiveFeeds();
        setInterval(fetchLiveFeeds, 15000);
    </script>
</body>
</html>
